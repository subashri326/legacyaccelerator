[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2c-accelerator"
version = "0.1.0"
description = "Legacy-to-Cloud Data Modernization Accelerator — metadata-driven, platform-neutral migration platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",
    "sqlglot>=25.0.0",
    "lxml>=5.2.0",
    "networkx>=3.3",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    "openpyxl>=3.1.5",
    "gitpython>=3.1.43",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Database drivers, one extra per engine; `connectors` installs them all.
sqlserver = ["pyodbc>=5.1.0"]  # SQL Server and Microsoft Fabric (needs Microsoft ODBC Driver 18)
oracle = ["oracledb>=2.4.0"]
teradata = ["teradatasqlalchemy>=20.0.0.9"]
snowflake = ["snowflake-sqlalchemy>=1.7.0", "snowflake-connector-python[pandas]>=3.12.0"]
databricks = ["databricks-sqlalchemy>=2.0.0"]
cloud-storage = ["boto3>=1.35.0", "azure-storage-blob>=12.22.0"]
connectors = [
    "pyodbc>=5.1.0",
    "oracledb>=2.4.0",
    "teradatasqlalchemy>=20.0.0.9",
    "snowflake-sqlalchemy>=1.7.0",
    "snowflake-connector-python[pandas]>=3.12.0",
    "databricks-sqlalchemy>=2.0.0",
    "boto3>=1.35.0",
    "azure-storage-blob>=12.22.0",
]
orchestration = [
    "celery>=5.4.0",
    "redis>=5.0.8",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
l2c = "accelerator.cli.main:app"

[project.entry-points."accelerator.plugins"]
# External plugin packages can register SourceCollector, Parser, TargetGenerator, Mover, or Validator classes here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accelerator = ["db/migrations/script.py.mako"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "FURB"]
ignore = ["B008", "E501"]
