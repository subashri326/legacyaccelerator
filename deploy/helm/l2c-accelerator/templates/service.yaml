apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-ui
  ports:
    - port: {{ .Values.service.uiPort }}
      targetPort: 80
