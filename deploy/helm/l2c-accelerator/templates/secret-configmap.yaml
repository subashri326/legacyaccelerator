apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  L2C_DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  L2C_STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  L2C_S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  L2C_VAULT_BACKEND: {{ .Values.config.vaultBackend | quote }}
  L2C_AUTH_MODE: {{ .Values.config.authMode | quote }}
  L2C_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  L2C_AI_ENABLED: {{ .Values.config.aiEnabled | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  L2C_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  L2C_HASHICORP_VAULT_TOKEN: {{ .Values.secrets.hashicorpVaultToken | quote }}
