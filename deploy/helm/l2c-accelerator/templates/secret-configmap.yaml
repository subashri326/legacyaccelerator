apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  L2C_ENVIRONMENT: {{ .Values.config.environment | quote }}
  L2C_STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  L2C_S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  L2C_VAULT_BACKEND: {{ .Values.config.vaultBackend | quote }}
  L2C_HASHICORP_VAULT_ADDR: {{ .Values.config.hashicorpVaultAddr | quote }}
  L2C_AUTH_MODE: {{ .Values.config.authMode | quote }}
  L2C_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  L2C_OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  L2C_OIDC_ROLE_CLAIM: {{ .Values.config.oidcRoleClaim | quote }}
  L2C_OIDC_ROLE_MAP: {{ .Values.config.oidcRoleMap | toJson | quote }}
  L2C_CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | toJson | quote }}
  L2C_AI_ENABLED: {{ .Values.config.aiEnabled | quote }}
---
# Everything that contains a credential lives here, not in the ConfigMap.
# In production prefer an external secret manager (e.g. External Secrets Operator) over values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  L2C_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  L2C_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  L2C_HASHICORP_VAULT_TOKEN: {{ .Values.secrets.hashicorpVaultToken | quote }}
  L2C_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
