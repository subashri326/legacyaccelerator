name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: l2c
          POSTGRES_PASSWORD: l2c
          POSTGRES_DB: l2c_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U l2c" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      L2C_TEST_POSTGRES_URL: postgresql+psycopg2://l2c:l2c@localhost:5432/l2c_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests (SQLite + PostgreSQL)
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
